<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cookiee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --hot-pink: #f45183;
      --blush: #fff0f5;
      --cream: #fffaf5;
      --ink: #442d42;
      --yellow: #ffe58a;
      --shadow: 0 18px 50px rgba(176, 79, 120, .16);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,255,255,.9) 0 2px, transparent 3px) 0 0 / 28px 28px,
        linear-gradient(145deg, #fff8f1 0%, #fff0f7 52%, #f6efff 100%);
      font-family: "Quicksand", sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 40px;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 3px 5px 24px;
    }

    .brand {
      color: var(--hot-pink);
      font-family: Pacifico, cursive;
      font-size: 22px;
      transform: rotate(-3deg);
    }

    nav { display: flex; gap: 26px; align-items: center; }
    nav a {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      transition: color .2s ease;
    }
    nav a:hover { color: var(--hot-pink); }
    .nav-heart { color: var(--hot-pink); font-size: 17px; }

    .hero {
      background: rgba(255, 255, 255, .75);
      border: 1.5px solid white;
      border-radius: 38px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1.03fr .97fr;
      min-height: 548px;
      overflow: hidden;
      position: relative;
    }

    .hero-copy {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: clamp(40px, 7vw, 84px) clamp(28px, 7vw, 82px);
    }
    .eyebrow {
      align-items: center;
      color: var(--hot-pink);
      display: flex;
      font-family: "DM Mono", monospace;
      font-size: 11px;
      gap: 8px;
      letter-spacing: .08em;
      margin-bottom: 22px;
      text-transform: uppercase;
    }
    .eyebrow:before { content: "✿"; font-size: 19px; }
    h1 {
      font-size: clamp(50px, 7vw, 87px);
      letter-spacing: -.08em;
      line-height: .89;
      margin: 0;
      max-width: 580px;
    }
    h1 span {
      color: var(--hot-pink);
      display: block;
      font-family: Pacifico, cursive;
      font-size: .72em;
      letter-spacing: -.04em;
      line-height: 1.25;
      margin: 6px 0 2px 9px;
      transform: rotate(-4deg);
    }
    h1 .see-you {
      color: var(--ink);
      display: block;
      font-family: "Quicksand", sans-serif;
      font-size: .5em;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 10px 0 0 9px;
    }
    .actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: auto;
      padding-top: 34px;
    }
    button {
      border: 0;
      border-radius: 99px;
      cursor: pointer;
      font: 700 13px "Quicksand", sans-serif;
      letter-spacing: .01em;
      padding: 14px 22px;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-3px) rotate(-1deg); }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 4px;
    }
    button:disabled { cursor: wait; opacity: .7; transform: none; }
    .primary { background: var(--hot-pink); box-shadow: 0 8px 20px rgba(244,81,131,.26); color: white; }
    .primary:hover { box-shadow: 0 12px 25px rgba(244,81,131,.34); }
    .secondary { background: var(--blush); border: 1px solid rgba(244,81,131,.2); color: var(--hot-pink); }
    .secondary:hover { box-shadow: 0 8px 18px rgba(244,81,131,.12); }

    .hero-art {
      align-items: center;
      background: linear-gradient(155deg, #ffd9e8 0%, #ffeaf3 56%, #e9ddff 100%);
      display: flex;
      justify-content: center;
      min-height: 420px;
      position: relative;
    }
    .camera-stage {
      position: relative;
      width: min(84%, 430px);
      z-index: 2;
    }
    .camera-frame {
      background: var(--cream);
      border: 3px solid var(--ink);
      box-shadow: 10px 12px 0 rgba(68,45,66,.14);
      padding: 13px;
      position: relative;
      transform: rotate(2deg);
    }
    .camera-frame:before,
    .camera-frame:after {
      border: 2px solid var(--hot-pink);
      content: "";
      height: 100%;
      left: -9px;
      pointer-events: none;
      position: absolute;
      top: -8px;
      transform: rotate(-3deg);
      width: 100%;
      z-index: -1;
    }
    .camera-frame:after { border-color: var(--yellow); left: 7px; top: 7px; transform: rotate(4deg); }
    .camera-video {
      aspect-ratio: 4 / 3;
      background: #302335;
      display: block;
      object-fit: cover;
      width: 100%;
    }
    .camera-video.is-off { opacity: .45; }
    .camera-caption {
      align-items: center;
      display: flex;
      justify-content: space-between;
      padding: 13px 3px 2px;
    }
    .camera-caption strong { font-family: Pacifico, cursive; font-size: 17px; font-weight: 400; }
    .camera-status { align-items: center; display: flex; font: 10px "DM Mono", monospace; gap: 6px; text-transform: uppercase; }
    .camera-status:before { background: var(--hot-pink); border-radius: 50%; content: ""; height: 7px; width: 7px; }
    .camera-status.live:before { background: #42b883; }
    .camera-button { display: block; margin: 18px auto 0; padding: 11px 17px; }
    .camera-doodle { color: var(--hot-pink); font-size: 26px; position: absolute; z-index: 3; }
    .camera-doodle.a { left: -24px; top: 21px; transform: rotate(-18deg); }
    .camera-doodle.b { right: -20px; top: 47px; color: #9276e9; transform: rotate(17deg); }
    .camera-doodle.c { bottom: 39px; left: -31px; color: #dfa91d; font-size: 20px; transform: rotate(-12deg); }
    .camera-doodle.d { bottom: 18px; right: -26px; color: var(--hot-pink); transform: rotate(14deg); }
    .camera-doodle.e { right: 12%; top: -25px; color: var(--ink); font-size: 17px; transform: rotate(10deg); }
    .hero-art:before, .hero-art:after {
      content: "";
      border: 2px solid rgba(244,81,131,.35);
      border-radius: 50%;
      height: 230px; width: 230px;
      position: absolute;
    }
    .hero-art:before { transform: rotate(25deg) scaleX(.7); }
    .hero-art:after { transform: rotate(-25deg) scaleX(.7); }

    .doodle { color: var(--hot-pink); font-size: 25px; position: absolute; z-index: 3; }

    .note {
      background: var(--yellow);
      border: 2px solid var(--ink);
      bottom: 31px;
      box-shadow: 5px 6px 0 rgba(68,45,66,.12);
      font-family: Pacifico, cursive;
      font-size: 14px;
      left: 35px;
      padding: 13px 16px;
      position: absolute;
      transform: rotate(-8deg);
      z-index: 4;
    }
    .note:before { content: "↗"; font-family: sans-serif; font-size: 20px; left: -23px; position: absolute; top: -17px; }

    .lower {
      display: grid;
      gap: 18px;
      grid-template-columns: 1.1fr .9fr;
      margin-top: 18px;
    }
    .card {
      background: rgba(255,255,255,.7);
      border: 1.5px solid white;
      border-radius: 25px;
      box-shadow: 0 10px 28px rgba(176,79,120,.09);
      padding: 23px 26px;
    }
    .card-label { color: var(--hot-pink); font: 11px "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .thought { align-items: center; display: flex; gap: 16px; margin-top: 17px; }
    .thought p { font-family: Pacifico, cursive; font-size: 22px; line-height: 1.35; margin: 0; }
    .mini-sun { align-items: center; background: var(--yellow); border: 2px solid var(--ink); border-radius: 50%; display: flex; flex: 0 0 48px; font-size: 23px; height: 48px; justify-content: center; transform: rotate(9deg); }
    .music-card { align-items: center; display: flex; gap: 18px; justify-content: space-between; min-height: 126px; }
    .music-card strong { display: block; font-family: Pacifico, cursive; font-size: 19px; font-weight: 400; }
    .music-card small { display: block; font-size: 12px; line-height: 1.4; margin-top: 5px; opacity: .7; }
    .music-toggle { flex: 0 0 auto; position: relative; }
    .music-toggle input { height: 1px; opacity: 0; position: absolute; width: 1px; }
    .switch { background: rgba(68,45,66,.18); border: 2px solid var(--ink); border-radius: 99px; cursor: pointer; display: block; height: 32px; padding: 3px; transition: background .2s ease; width: 58px; }
    .switch:before { background: white; border-radius: 50%; content: ""; display: block; height: 22px; transition: transform .2s ease; width: 22px; }
    .music-toggle input:checked + .switch { background: var(--hot-pink); }
    .music-toggle input:checked + .switch:before { transform: translateX(24px); }
    .music-toggle input:focus-visible + .switch { outline: 3px solid var(--yellow); outline-offset: 4px; }
    .spark { animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px) rotate(5deg); } }
    .burst { animation: burst .7s ease-out forwards; }
    @keyframes burst { 0% { opacity: 1; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.5) translateY(-30px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *:before, *:after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
    @media (max-width: 720px) {
      .page { width: min(100% - 24px, 540px); padding-top: 13px; }
      header { padding-bottom: 15px; }
      nav a:not(.nav-heart) { display: none; }
      .hero { grid-template-columns: 1fr; }
      .hero-copy { padding: 45px 27px 32px; }
      .hero-art { min-height: 330px; }
      .lower { grid-template-columns: 1fr; }
      h1 { font-size: 58px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="brand">My Cookiee ♡</div>
      <nav aria-label="Main navigation">
        <a href="#little-thoughts">little thoughts</a>
        <a class="nav-heart" href="#top" aria-label="Back to top">♡</a>
      </nav>
    </header>

    <section class="hero" id="top">
      <div class="hero-copy">
        <div class="eyebrow">a tiny love </div>
        <h1>My<br><span>Cookiee</span><span class="see-you">this is how i see you ♡. .</span></h1>
        <div class="actions">
          <button class="primary" id="sparkleButton" type="button">send a sparkle ✦</button>
          <button class="secondary" id="noteButton" type="button">open a note ♡</button>
        </div>
      </div>
      <div class="hero-art" aria-label="Live camera feed">
        <div class="camera-stage">
          <div class="camera-doodle a spark">♡</div>
          <div class="camera-doodle b spark">✦</div>
          <div class="camera-doodle c">✧</div>
          <div class="camera-doodle d">♡</div>
          <div class="camera-doodle e">✿</div>
          <div class="camera-frame">
            <video class="camera-video is-off" id="cameraVideo" aria-label="Live camera preview" autoplay playsinline muted></video>
            <div class="camera-caption">
              <strong>hi, pretty ♡</strong>
              <span class="camera-status" id="cameraStatus" role="status" aria-live="polite">camera off</span>
            </div>
          </div>
          <div class="note" id="note">cutie alert!</div>
          <button class="primary camera-button" id="cameraButton" type="button">turn on my cam ♡</button>
        </div>
      </div>
    </section>

    <section class="lower" id="little-thoughts">
      <article class="card">
        <div class="card-label">currently thinking</div>
        <div class="thought">
          <div class="mini-sun">☀</div>
          <p>“I hope you know how wildly wonderful you are.”</p>
        </div>
      </article>
      <article class="card music-card">
        <div>
          <div class="card-label">song</div>
          <strong>press play, pretty ♡</strong>
          <small id="musicStatus" role="status" aria-live="polite">Dariya.mp3</small>
        </div>
        <label class="music-toggle" aria-label="Play or pause our song">
          <input id="musicToggle" type="checkbox" aria-label="Play or pause our song">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </article>
    </section>

    <audio id="loveSong" loop preload="auto" playsinline aria-label="Background song">
      <source src="Dariya.mp3" type="audio/mpeg">
    </audio>

  </main>
  <script>
    const sparkleButton = document.querySelector("#sparkleButton");
    const art = document.querySelector(".hero-art");
    const noteButton = document.querySelector("#noteButton");
    const note = document.querySelector("#note");
    const cameraButton = document.querySelector("#cameraButton");
    const cameraVideo = document.querySelector("#cameraVideo");
    const cameraStatus = document.querySelector("#cameraStatus");
    const loveSong = document.querySelector("#loveSong");
    const musicToggle = document.querySelector("#musicToggle");
    const musicStatus = document.querySelector("#musicStatus");
    const notes = ["cutie alert!", "you are magic!", "big heart energy ♡" , "you are my sunshine ☀", "you are a star ✦", "you are loved!", "you are my favorite!", "you are the best!", "you are amazing!"];
    let noteIndex = 0;

    const updateMusicState = (isPlaying) => {
      musicToggle.checked = isPlaying;
      musicStatus.textContent = isPlaying ? "playing now ♫" : "paused for the moment";
    };

    loveSong.addEventListener("error", () => {
      updateMusicState(false);
      musicStatus.textContent = "could not load Dariya.mp3";
    });

    const musicFile = fetch("Dariya.mp3")
      .then((response) => {
        if (!response.ok) throw new Error("Music file not found");
        return response.blob();
      })
      .then((musicBlob) => {
        loveSong.src = URL.createObjectURL(musicBlob);
        loveSong.load();
      });

    const startMusic = () => {
      musicFile.then(() => loveSong.play()).then(() => updateMusicState(true)).catch((error) => {
        updateMusicState(false);
        musicStatus.textContent = error.name === "NotAllowedError"
          ? "tap the switch to start your song"
          : "could not play Dariya.mp3";
      });
    };

    musicToggle.addEventListener("change", () => {
      if (musicToggle.checked) {
        musicFile.then(() => loveSong.play()).then(() => updateMusicState(true)).catch(() => {
          updateMusicState(false);
          musicStatus.textContent = "could not play Dariya.mp3";
        });
      } else {
        loveSong.pause();
        updateMusicState(false);
      }
    });

    sparkleButton.addEventListener("click", () => {
      for (let i = 0; i < 9; i += 1) {
        const star = document.createElement("span");
        star.textContent = i % 2 ? "✦" : "♡";
        star.className = "doodle burst";
        star.style.left = `${35 + Math.random() * 30}%`;
        star.style.top = `${30 + Math.random() * 35}%`;
        star.style.animationDelay = `${i * 45}ms`;
        art.appendChild(star);
        setTimeout(() => star.remove(), 850);
      }
    });

    noteButton.addEventListener("click", () => {
      noteIndex = (noteIndex + 1) % notes.length;
      note.textContent = notes[noteIndex];
      note.animate([{ transform: "rotate(-8deg) scale(.8)" }, { transform: "rotate(-8deg) scale(1)" }], { duration: 280, easing: "ease-out" });
    });

    cameraButton.addEventListener("click", async () => {
      cameraButton.disabled = true;
      cameraButton.textContent = "asking for camera...";

      if (!navigator.mediaDevices?.getUserMedia) {
        cameraStatus.textContent = "camera unavailable";
        cameraButton.textContent = "camera not supported";
        cameraButton.disabled = false;
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        cameraVideo.srcObject = stream;
        cameraVideo.classList.remove("is-off");
        cameraStatus.classList.add("live");
        cameraStatus.textContent = "live now";
        cameraButton.textContent = "camera is on ♡";
      } catch {
        cameraStatus.textContent = "permission needed";
        cameraButton.textContent = "try camera again ♡";
        cameraButton.disabled = false;
      }
    });

  </script>
</body>
</html>
